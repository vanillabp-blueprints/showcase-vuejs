# Everything the application needs on a developer's machine.
# Start the application with the profile `local`.
services:
  mongodb:
    image: mongo:8.0.4
    container_name: business-cockpit-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.hello().ok"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Initiates the single-node replica set, creates the database and its user, then ends.
  mongodb-setup:
    image: mongo:8.0.4
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - mongosh
      - --quiet
      - --host
      - mongodb
      - --eval
      - |
        try { rs.status(); } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "business-cockpit-mongo:27017"}]}); }
        while (!db.hello().isWritablePrimary) { sleep(500); }
        const cockpit = db.getSiblingDB("business-cockpit");
        if (!cockpit.getUser("business-cockpit")) {
          cockpit.createUser({user: "business-cockpit", pwd: "business-cockpit", roles: [{role: "dbOwner", db: "business-cockpit"}]});
        }

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 5s
      retries: 20

  # The OIDC provider. The realm of keycloak/realm.json is imported at the first start; to import
  # it again, remove the volume of the project (docker compose down -v).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      # The image has no curl: open the management port and ask for readiness.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  mongodb-data:
